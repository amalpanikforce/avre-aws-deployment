name: Client Deployment

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client/Environment to deploy (e.g., sandbox, sandbox3)'
        required: true
        type: choice
        options:
          - sandbox
          - sandbox3
          - kforce
      version:
        description: 'Version to deploy (e.g., 1.0.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.client }}
    runs-on: ubuntu-latest
    
    # Use GitHub Environments to enforce approval gates
    environment: ${{ github.event.inputs.client }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenTofu (Terragrunt dependency)
        uses: opentofu/setup-opentofu@v1

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v1.1.0
        with:
          terragrunt_version: latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Run Deployment Script
        env:
          CI: true # Bypasses the interactive prompt in deploy.sh
          # The GitHub token is passed to deploy.sh for GHCR auth if needed
          # But the script currently pulls from AWS Secrets Manager
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh ${{ github.event.inputs.client }} ${{ github.event.inputs.version }}
